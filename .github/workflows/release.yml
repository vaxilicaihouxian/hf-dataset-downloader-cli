name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build release binaries
        run: |
          mkdir -p dist/package
          build() {
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/package/hf-dataset-download hf_dataset_download.go
            tar -C dist/package -czf "dist/hf-dataset-downloader_${GITHUB_REF_NAME}_$3.tar.gz" hf-dataset-download
          }
          build linux amd64 linux_amd64
          build darwin arm64 darwin_arm64
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
